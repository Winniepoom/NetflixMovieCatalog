  name: Netflix Catalog CI/CD

  on:
    pull_request:
      branches:
        - main
    push:
      branches:
        - main

  permissions:
    contents: read

  env:
    AWS_REGION: ${{ vars.AWS_REGION }}
    ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

  jobs:
    build:
      name: Validate and Build
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set Up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt

        - name: Audit Python Dependencies
          run: |
            python -m pip install pip-audit
            pip-audit -r requirements.txt

        - name: Validate Python Source
          run: python -m compileall app.py

        - name: Build Docker Image
          run: docker build -t netflix-movie-catalog:ci-${{ github.sha }} .

    publish:
      name: Publish Image to ECR
      needs: build
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      permissions:
        contents: read
        id-token: write
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Configure AWS Credentials with OIDC
          uses: aws-actions/configure-aws-credentials@v6.2.3
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Log In to Amazon ECR
          id: ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build and Push Image
          env:
            REGISTRY: ${{ steps.ecr.outputs.registry }}
            IMAGE_TAG: ${{ github.sha }}
          run: |
            docker build \
              --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
              --tag "$REGISTRY/$ECR_REPOSITORY:main" \
              .
            docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            docker push "$REGISTRY/$ECR_REPOSITORY:main"
