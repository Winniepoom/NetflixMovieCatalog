  name: Netflix Catalog CI

  on:
    pull_request:
      branches:
        - main
    push:
      branches:
        - main

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Run a Script
          run: echo "Code pushed or PR opened. Run build checks."

        - name: Set Up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt

        - name: Validate Python Source
          run: python -m compileall app.py
	
	- name: Build docker image
	  run: docker build -t netflix-movie-catalog:ci-${{github.sha}} .
